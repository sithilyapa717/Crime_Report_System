packages:
  - 'apps/desktop/*'
  - 'packages/shared/*'
  - 'packages/services/*'
  - 'packages/db'
  - 'packages/documents'
  - 'packages/migration'
  - 'tests/database'
  - 'tests/e2e'
  - 'tests/migration'
allowBuilds:
  esbuild: true
  better-sqlite3: true
  # Squirrel installer tooling; the NSIS build does not use it.
  electron-winstaller: false
